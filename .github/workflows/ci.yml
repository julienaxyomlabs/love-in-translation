name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests · python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and repository tests
        run: python -m unittest discover -s tests -t tests -v
      - name: Byte-compile
        run: python -m compileall -q src tools tests

  repository:
    name: paper, ledger, lint, CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Markdown links, math delimiters, no raw HTML
        run: python tools/lint_markdown.py
      - name: Evidence ledger is up to date
        run: python tools/extract_claims.py --check
      - name: Ruff
        run: |
          python -m pip install --quiet ruff==0.6.9
          ruff check .
      - name: Install and smoke-test the CLI
        run: |
          python -m pip install --quiet .
          love-translation --version
          love-translation cosine-demo
          love-translation trust --slope 4.5 --midpoint 0.5
          love-translation claims --grade hypothesis --count
      - name: Single-file paper builds
        run: python tools/build_paper.py --out dist/paper.md
