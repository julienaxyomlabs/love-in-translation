[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "love-translation"
version = "0.3.0"
description = "Reference implementation of a formal model of how care moves between two people, with executable tests of its mathematical claims."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julien Poulain" }]
keywords = [
  "relationship science",
  "dyadic data",
  "response surface analysis",
  "signal detection",
  "bayesian inference",
  "dynamical systems",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/julienaxyomlabs/love-in-translation"
Paper = "https://github.com/julienaxyomlabs/love-in-translation/tree/main/paper"

[project.scripts]
love-translation = "love_translation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
love_translation = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
